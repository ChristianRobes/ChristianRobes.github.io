<title>Christian Robes</title>
<meta name="claude:viewport-fit-sides" content="cover"><meta name="description" content="Christian Robes: moda social masculina e feminina. Veja as peças e faça seu pedido pelo WhatsApp.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Cormorant+Garamond:wght@500;600&family=Familjen+Grotesk:wght@500;600&family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style id="app-style">
/* Layout: faixa escura com risca de giz e carrossel de ternos, vitrine em grade, painel de edição lateral */
:root{--bg:#eef0f4;--surface:#ffffff;--fg:#0f1623;--muted:#5b6475;--line:#d8dde6;--accent:#1f3d73;--on-accent:#ffffff;--hero-bg:#101a2d;--hero-fg:#eef1f7;--hero-line:rgba(255,255,255,.07);--display:'Bodoni Moda',Georgia,serif;--body:'Hanken Grotesk',system-ui,sans-serif;--r:6px;--cols:3}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0d1118;--surface:#151b25;--fg:#e9edf4;--muted:#9aa4b5;--line:#262e3b;--accent:#7f9fd6;--on-accent:#0d1118;--hero-bg:#080c13;--hero-fg:#eef1f7;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1118;--surface:#151b25;--fg:#e9edf4;--muted:#9aa4b5;--line:#262e3b;--accent:#7f9fd6;--on-accent:#0d1118;--hero-bg:#080c13;--hero-fg:#eef1f7;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage :focus-visible{outline-color:var(--hero-fg)}
h1,h2,h3,p{margin:0}
.w{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.announce{background:var(--accent);color:var(--on-accent);font-size:.8125rem;text-align:center;padding:.5rem 0;letter-spacing:.02em}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hdr .w{display:flex;align-items:center;gap:1rem;min-height:60px}
.logo{display:flex;align-items:center;gap:.65rem;text-decoration:none;min-width:0}
.logo img{height:34px;width:auto;max-width:240px;object-fit:contain}
.mono{flex:none;width:34px;height:34px;display:grid;place-items:center;background:var(--fg);color:var(--bg);font-family:var(--display);font-weight:700;font-size:.95rem;letter-spacing:.02em;border-radius:var(--r)}
.lname{font-family:var(--display);font-size:1.1rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:none;margin-left:auto;gap:1.5rem;font-size:.9rem}
.nav a{text-decoration:none;color:var(--muted)}
.nav a:hover{color:var(--fg)}
.cartbtn{margin-left:auto;display:flex;align-items:center;gap:.5rem;background:transparent;border:1px solid var(--line);border-radius:var(--r);padding:.5rem .85rem;min-height:44px;font-weight:600}
.cartbtn b{display:inline-grid;place-items:center;min-width:1.4rem;height:1.4rem;padding:0 .3rem;border-radius:99px;background:var(--accent);color:var(--on-accent);font-size:.75rem}
@media(min-width:640px){.nav{display:flex}.nav+.cartbtn{margin-left:1.5rem}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border:1px solid transparent;border-radius:var(--r);padding:.75rem 1.4rem;min-height:46px;font-weight:600;text-decoration:none;cursor:pointer;text-align:center}
.btn-p{background:var(--accent);color:var(--on-accent)}
.btn-g{background:transparent;border-color:var(--line)}
.btn-l{background:var(--hero-fg);color:var(--hero-bg)}
.btn-o{background:transparent;border-color:rgba(255,255,255,.35);color:var(--hero-fg)}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.btn-sm{padding:.45rem .8rem;min-height:38px;font-size:.875rem}
.stage{position:relative;overflow:hidden;background-color:var(--hero-bg);color:var(--hero-fg)}
.stage.pin{background-image:repeating-linear-gradient(90deg,var(--hero-line) 0 1px,transparent 1px 26px)}

.stage .w{position:relative;z-index:1}
.hero{padding-block:clamp(2.5rem,8vw,5.5rem) clamp(2rem,5vw,3rem)}
.eyebrow{font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;opacity:.75}
.hero h1{font-family:var(--display);font-weight:600;font-size:clamp(2.2rem,7.2vw,4.4rem);line-height:1.04;letter-spacing:-.01em;margin-top:.9rem;max-width:16ch;text-wrap:balance}

.car{padding-block:1rem clamp(2.5rem,6vw,4rem)}
.carhead{display:flex;align-items:end;justify-content:space-between;gap:1rem;margin-bottom:1rem;border-top:1px solid rgba(255,255,255,.14);padding-top:1.2rem}
.carhead h2{font-family:var(--display);font-size:1.5rem;font-weight:600}
.carctl{display:flex;align-items:center;gap:.5rem;font-size:.85rem;font-variant-numeric:tabular-nums}

.track{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:.5rem;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 min(74vw,270px);scroll-snap-align:start}

function buildDoc(){
 var rs=Array.prototype.slice.call(document.head.querySelectorAll('style')).filter(function(s){return /safe-area-inset-top/.test(s.textContent)&&/hidden/.test(s.textContent)})[0];
 var reset=rs?rs.textContent:FALLBACK_RESET;
 var json=JSON.stringify(S).replace(/</g,'\\u003c');
 var css=$('#app-style').textContent,js=$('#app-script').textContent;
 var content=TITLE+META+FONTS+'<style id="app-style">'+css+'</style><style id="theme">'+themeCss(S)+'</style>'+SHELL+'<script id="state" type="application/json">'+json+'</'+'script><script id="app-script">'+js+'</'+'script>';
 return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'+content+'</body></html>';
}
function save(){
 if(ui.saving)return;
 ui.saving=true;ui.msg='';renderFoot();
 var c=window.claude&&window.claude.use;
 if(!c){ui.saving=false;ui.msg='Não foi possível publicar daqui. Abra a loja no Claude para salvar.';renderFoot();return}
 window.claude.use('artifact').then(function(a){
  if(!a)throw {code:'unavailable'};
  return a.publish(buildDoc());
 }).catch(function(e){
  ui.saving=false;
  var code=e&&e.code;
  ui.msg=code==='conflict'?'Outra versão foi publicada antes. A página vai recarregar.':(code==='not_granted'||code==='not_writer')?'Você não tem permissão para publicar esta loja.':'Não foi possível publicar. Tente de novo.';
  renderFoot();
 });
}

function bind(t){
 var path=t.dataset.b,v;
 if(t.dataset.arr){var arr=(get(path)||[]).slice(),k=t.dataset.arr,ix=arr.indexOf(k);if(t.checked&&ix<0)arr.push(k);if(!t.checked&&ix>-1)arr.splice(ix,1);v=arr}
 else if(t.type==='checkbox')v=t.checked;
 else if(t.type==='radio'){if(!t.checked)return;v=t.value}
 else v=t.value;
 var ty=t.dataset.t;
 if(ty==='num')v=parseFloat(String(v).replace(',','.'))||0;
 else if(ty==='int')v=parseInt(v,10)||0;
 else if(ty==='list')v=String(v).split(',').map(function(s){return s.trim()}).filter(Boolean);
 set(path,v);
 var m=path.match(/^products\.(\d+)\./);if(m){S.products[m[1]].demo=false}
 var resetAccent=path==='theme.preset'&&S.theme.accent;
  var mc=path.match(/^products\.(\d+)\.category$/),rer=false;
  if(mc){var pp=S.products[mc[1]];pp.alsoIn=(pp.alsoIn||[]).filter(function(x){return x!==pp.category});if(pp.type&&(S.types[pp.category]||[]).indexOf(pp.type)<0)pp.type='';rer=true}
 if(resetAccent)S.theme.accent='';
 dirty();refresh();
 if(resetAccent||rer){var ab=$('#abody'),sc=ab?ab.scrollTop:0;renderAdmin();var nb=$('#abody');if(nb)nb.scrollTop=sc}
}

function uploadTo(file,cb,logo){
 if(!file)return;
 if(!/^image\/(jpeg|png|webp)$/.test(file.type)){toast('Use uma imagem JPG, PNG ou WebP');return}
 if(file.size>12*1024*1024){toast('A imagem passa de 12 MB. Escolha uma menor');return}
 ui.uploading=true;renderAdmin();
 var url=URL.createObjectURL(file),im=new Image();
 im.onload=function(){
  var m=logo?800:1200,r=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=Math.round(im.width*r);c.height=Math.round(im.height*r);
  var g=c.getContext('2d');if(!logo){g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height)}
  g.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);
  var d='';try{d=logo?c.toDataURL('image/png'):c.toDataURL('image/jpeg',.82)}catch(e){}
  ui.uploading=false;
  if(!d){toast('Não foi possível ler a imagem');renderAdmin();return}
  cb(d);dirty();refresh();renderAdmin();toast('Foto carregada. Toque em Publicar para salvar');
 };
 im.onerror=function(){URL.revokeObjectURL(url);ui.uploading=false;toast('Não foi possível abrir essa imagem');renderAdmin()};
 im.src=url;
}
function act(a,el){
 var d=el.dataset;
 switch(a){
 case 'open':openProduct(d.id);break;
 case 'closemodal':ui.modal=null;renderModal();break;

 case 'mq':ui.modal.qty=Math.max(1,Math.min(20,ui.modal.qty+parseInt(d.d,10)));renderModal();break;
 case 'add':addToCart();break;
 case 'opencart':ui.cartOpen=true;renderCart();break;
 case 'closecart':ui.cartOpen=false;renderCart();break;
 case 'qty':var c=cart[d.i];if(c){c.qty=Math.max(1,Math.min(20,c.qty+parseInt(d.d,10)));saveCart();renderCart();refresh()}break;
 case 'rm':cart.splice(parseInt(d.i,10),1);saveCart();renderCart();refresh();break;
 case 'cat':ui.cat=d.c;ui.type='';renderChips();renderGrid();break;
  case 'ftype':ui.type=d.v;renderChips();renderGrid();break;
  case 'focc':ui.occ=d.v;renderChips();renderGrid();break;
  case 'typeadd':var tci=parseInt(d.ci,10),tc=S.categories[tci],tinp=$('#typenew'+tci),tn=tinp?tinp.value.trim():'';if(tc&&tn){S.types[tc]=S.types[tc]||[];if(S.types[tc].indexOf(tn)<0){S.types[tc].push(tn);dirty();refresh();renderAdmin()}}break;
  case 'typedel':var dci=parseInt(d.ci,10),dc=S.categories[dci],dti=parseInt(d.ti,10),dt=(S.types[dc]||[])[dti];if(dt!==undefined){if(S.products.some(function(p){return p.category===dc&&p.type===dt})){toast('Mude as peças desse tipo antes de remover')}else{S.types[dc].splice(dti,1);dirty();refresh();renderAdmin()}}break;
  case 'occadd':var oinp=$('#occnew'),on=oinp?oinp.value.trim():'';if(on&&S.occasions.indexOf(on)<0){S.occasions.push(on);dirty();refresh();renderAdmin()}break;
  case 'occdel':var odi=parseInt(d.i,10),od=S.occasions[odi];if(od!==undefined){if(S.products.some(function(p){return (p.occasions||[]).indexOf(od)>-1})){toast('Mude as peças dessa ocasião antes de remover')}else{S.occasions.splice(odi,1);dirty();refresh();renderAdmin()}}break;
 case 'car':var tr=$('#track');if(tr&&tr.firstElementChild)tr.scrollBy({left:parseInt(d.d,10)*(tr.firstElementChild.offsetWidth+14),behavior:reduce?'auto':'smooth'});break;
 case 'goto':var t=document.getElementById(d.to);if(t){var y=t.getBoundingClientRect().top+window.scrollY-64;window.scrollTo({top:y,behavior:reduce?'auto':'smooth'})}break;
 case 'top':window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});break;
 case 'adminopen':ui.adminOpen=true;ui.peek=false;renderAdmin();break;
 case 'adminclose':ui.adminOpen=false;ui.peek=false;renderAdmin();break;
 case 'peek':ui.peek=!ui.peek;renderAdmin();break;
 case 'tab':ui.tab=d.t;ui.editId=null;renderAdmin();break;
 case 'accentreset':S.theme.accent='';dirty();refresh();renderAdmin();break;
 case 'rmlogo':S.store.logo='';dirty();refresh();renderAdmin();break;
 case 'addprod':var np={id:'p'+Date.now().toString(36),name:'Nova peça',category:S.categories[0]||'',price:0,oldPrice:0,sizes:[],color:'#1c2b4a',shape:'paleto',type:'',occasions:[],alsoIn:[],desc:'',img:'',visible:true,featured:false,stock:true};S.products.push(np);ui.editId=np.id;dirty();refresh();renderAdmin();break;
 case 'editprod':ui.editId=d.id;ui.confirmDel=null;renderAdmin();break;
 case 'backprod':ui.editId=null;ui.confirmDel=null;renderAdmin();break;
 case 'mvup':case 'mvdn':var i=parseInt(d.i,10),j=a==='mvup'?i-1:i+1;if(j>=0&&j<S.products.length){var tmp=S.products[i];S.products[i]=S.products[j];S.products[j]=tmp;dirty();refresh();renderAdmin()}break;
 case 'dupprod':var ix=S.products.findIndex(function(p){return p.id===ui.editId});if(ix>-1){var cp=JSON.parse(JSON.stringify(S.products[ix]));cp.id='p'+Date.now().toString(36);cp.name+=' (cópia)';cp.demo=false;S.products.splice(ix+1,0,cp);ui.editId=cp.id;dirty();refresh();renderAdmin()}break;
 case 'delprod':if(ui.confirmDel===ui.editId){S.products=S.products.filter(function(p){return p.id!==ui.editId});cart=cart.filter(function(c){return c.id!==ui.editId});saveCart();ui.editId=null;ui.confirmDel=null;dirty();refresh();renderAdmin()}else{ui.confirmDel=ui.editId;renderAdmin()}break;
 case 'rmimg':var k=S.products.findIndex(function(p){return p.id===ui.editId});if(k>-1){S.products[k].img='';dirty();refresh();renderAdmin()}break;
 case 'catadd':var inp=$('#catnew'),nm=inp?inp.value.trim():'';if(nm&&S.categories.indexOf(nm)<0){S.categories.push(nm);S.types[nm]=[];dirty();refresh();renderAdmin()}break;
 case 'catdel':var ci=parseInt(d.i,10),cn=S.categories[ci];if(S.products.some(function(p){return p.category===cn||(p.alsoIn||[]).indexOf(cn)>-1})){toast('Mude as peças dessa categoria antes de remover');}else{S.categories.splice(ci,1);delete S.types[cn];dirty();refresh();renderAdmin()}break;
 case 'save':save();break;
 case 'discard':S=JSON.parse(ORIG);ui.dirty=false;ui.msg='';ui.editId=null;refresh();renderAdmin();break;
 }
}

 if(t.dataset&&t.dataset.b&&t.type!=='checkbox'&&t.type!=='radio'&&t.tagName!=='SELECT')bind(t);
});
document.addEventListener('change',function(e){
 var t=e.target;
 if(t.name==='pay'){ui.co.pay=t.value;renderCart();return}
 if(t.name==='deliv'){ui.co.deliv=t.value;renderCart();return}
 if(t.dataset&&t.dataset.b&&(t.type==='checkbox'||t.type==='radio'||t.tagName==='SELECT'))bind(t);
 else if(t.dataset&&t.dataset.act==='catrename'){
  var i=parseInt(t.dataset.i,10),old=S.categories[i],nv=t.value.trim();
  if(!nv||(S.categories.indexOf(nv)>-1&&nv!==old)){t.value=old;return}
  S.products.forEach(function(p){if(p.category===old)p.category=nv;if(p.alsoIn)p.alsoIn=p.alsoIn.map(function(x){return x===old?nv:x})});
  if(S.types[old]){S.types[nv]=S.types[old];delete S.types[old]}S.categories[i]=nv;if(ui.cat===old)ui.cat='';dirty();refresh();
 }
 else if(t.dataset&&t.dataset.act==='uploadprod'){var f=t.files&&t.files[0];var ix=S.products.findIndex(function(p){return p.id===ui.editId});if(f&&ix>-1){renderAdmin();uploadTo(f,function(u){S.products[ix].img=u;S.products[ix].demo=false})}}
 else if(t.dataset&&t.dataset.act==='uploadlogo'){var f2=t.files&&t.files[0];uploadTo(f2,function(u){S.store.logo=u},true)}
});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape'){if(ui.modal){ui.modal=null;renderModal()}else if(ui.cartOpen){ui.cartOpen=false;renderCart()}}
});

/* ---------- início ---------- */
applyTheme();renderStore();renderAdmin();
if(window.claude&&window.claude.use){
 window.claude.use('user').then(function(u){
  var ok=false;try{ok=!!(u&&u.canEdit&&u.canEdit())}catch(e){}
  if(ok){ui.isEd=true;renderAdmin()}
 }).catch(function(){});
}
})();
</script>

</body></html>
